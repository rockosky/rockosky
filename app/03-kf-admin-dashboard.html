<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap');

#kf-admin { --kf-black:#000; --kf-red:#e2231a; --kf-line:#262626; --kf-gray:#8a8a8a;
  background:var(--kf-black); color:#eee; font-family:'Inter',sans-serif; padding:32px 20px;
  max-width:1000px; margin:0 auto; border:1px solid var(--kf-line); border-radius:6px;
  box-shadow:0 30px 80px rgba(0,0,0,.5); }
#kf-admin h2 { font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin:0 0 4px; color:#fff; }
#kf-admin .kf-sub { font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--kf-red); margin-bottom:24px; }
#kf-admin input[type=email], #kf-admin input[type=password] {
  width:100%; max-width:320px; background:var(--kf-black); border:1px solid var(--kf-line); color:#eee; padding:12px 14px; border-radius:2px;
  font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.03em; margin-bottom:12px; box-sizing:border-box; display:block; }
#kf-admin input[type=text], #kf-admin input[type=number], #kf-admin textarea, #kf-admin select {
  width:100%; background:var(--kf-black); border:1px solid var(--kf-line); color:#eee; padding:10px 12px; border-radius:2px;
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.03em; margin-bottom:8px; box-sizing:border-box; }
#kf-admin textarea { min-height:60px; resize:vertical; font-family:'Inter',sans-serif; font-size:13px; }
#kf-admin input::placeholder, #kf-admin textarea::placeholder { color:var(--kf-gray); }
#kf-admin input:focus, #kf-admin textarea:focus, #kf-admin select:focus { outline:none; border-color:var(--kf-red); }
#kf-admin button.kf-btn { display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; font-weight:700;
  background:var(--kf-red); border:1px solid var(--kf-red); color:#000; padding:9px 16px; border-radius:999px; cursor:pointer; margin-right:8px; transition:background .2s ease,color .2s ease; }
#kf-admin button.kf-btn::before { content:''; width:5px; height:5px; border-radius:50%; background:#000; transition:background .2s ease; }
#kf-admin button.kf-btn:hover:not(:disabled) { background:transparent; color:var(--kf-red); }
#kf-admin button.kf-btn:hover:not(:disabled)::before { background:var(--kf-red); }
#kf-admin button.kf-btn.reject { background:transparent; border-color:var(--kf-line); color:var(--kf-gray); }
#kf-admin button.kf-btn.reject::before { background:var(--kf-gray); }
#kf-admin button.kf-btn.reject:hover:not(:disabled) { border-color:#fff; color:#fff; }
#kf-admin button.kf-btn.reject:hover:not(:disabled)::before { background:#fff; }
#kf-admin button.kf-btn:disabled { background:#333; border-color:#333; color:#777; cursor:not-allowed; }
#kf-admin button.kf-btn:disabled::before { background:#777; }
#kf-admin .kf-msg { font-family:'IBM Plex Mono',monospace; font-size:12px; margin-top:10px; color:var(--kf-gray); min-height:16px; }
#kf-admin .kf-msg.err { color:var(--kf-red); }
#kf-admin .kf-msg.ok { color:#5fbf7a; }
#kf-admin .kf-row { display:flex; gap:16px; align-items:flex-start; border-bottom:1px solid var(--kf-line); padding:16px 0; }
#kf-admin .kf-row img { width:120px; height:120px; object-fit:cover; flex-shrink:0; border:1px solid var(--kf-line); border-radius:2px; }
#kf-admin .kf-meta { font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.03em; color:var(--kf-gray); flex:1.2; }
#kf-admin .kf-meta .cap { color:#eee; font-family:'Inter',sans-serif; font-size:13px; margin-bottom:6px; }
#kf-admin .kf-form { flex:2; }
#kf-admin .kf-label { font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--kf-gray); margin-bottom:3px; }
#kf-admin .kf-empty { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--kf-gray); }
#kf-admin .kf-price-row { display:flex; gap:8px; }
#kf-admin .kf-price-row input { width:100px; }
#kf-admin .kf-price-row select { flex:1; }
</style>

<div id="kf-admin">
  <h2>Ketchup Files</h2>
  <div class="kf-sub">Upload Review — Admin Only</div>

  <div id="kf-admin-login">
    <input type="email" id="kf-a-email" placeholder="Admin email" autocomplete="email" />
    <input type="password" id="kf-a-password" placeholder="Password" autocomplete="current-password" />
    <button class="kf-btn" id="kf-a-submit">Log In</button>
    <div class="kf-msg" id="kf-a-msg"></div>
  </div>

  <div id="kf-admin-panel" style="display:none;">
    <div id="kf-pending-list"><div class="kf-empty">Loading pending uploads…</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  // ---- CONFIG ----
  var SUPABASE_URL = "https://lfbtreaojwxxwuwhssba.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_KX1Hpau0Lc7M_n1snlYbEw_lnr_GfL9";
  var BUCKET = "Ketchup Files UPLOADS";
  var ADMIN_EMAIL = "creators@ketchupfiles.com";
  // URL of the Vercel function that talks to Squarespace (set once deployed):
  var PUBLISH_ENDPOINT = "https://vercel-publish-fawn.vercel.app/api/publish-product";
  var CITIES = ["New York","Milan","Paris","London","Copenhagen","Tokyo"];
  // ----------------

  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function setMsg(text, cls){
    var el = document.getElementById('kf-a-msg');
    el.textContent = text || '';
    el.className = 'kf-msg' + (cls ? ' ' + cls : '');
  }

  document.getElementById('kf-a-submit').addEventListener('click', async function(){
    var email = document.getElementById('kf-a-email').value.trim();
    var password = document.getElementById('kf-a-password').value;
    if(!email || !password){ setMsg('Enter email and password.', 'err'); return; }
    setMsg('Logging in…');
    var res = await sb.auth.signInWithPassword({ email: email, password: password });
    if(res.error){ setMsg(res.error.message, 'err'); return; }
    if(email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
      await sb.auth.signOut();
      setMsg('This account is not authorized to review uploads.', 'err');
      return;
    }
    setMsg('', '');
    document.getElementById('kf-admin-login').style.display = 'none';
    document.getElementById('kf-admin-panel').style.display = 'block';
    loadPending();
  });

  async function loadPending(){
    var el = document.getElementById('kf-pending-list');
    var res = await sb.from('photos').select('id, file_path, title, description, season, price_cents, city, hashtags, social_url, user_id, created_at, media_type, category').eq('status', 'pending').order('created_at', { ascending: true });
    if(res.error){
      el.innerHTML = '<div class="kf-empty">Error loading uploads: ' + res.error.message + '</div>';
      return;
    }
    if(!res.data || res.data.length === 0){
      el.innerHTML = '<div class="kf-empty">No pending uploads.</div>';
      return;
    }
    el.innerHTML = '';
    res.data.forEach(function(row){
      var url = sb.storage.from(BUCKET).getPublicUrl(row.file_path).data.publicUrl;
      var cityOptions = '<option value="">City…</option>' + CITIES.map(function(c){
        return '<option value="'+c+'"' + (row.city === c ? ' selected' : '') + '>'+c+'</option>';
      }).join('');
      var priceVal = row.price_cents != null ? (row.price_cents / 100).toFixed(2) : '';
      var CATEGORY_LABELS = { photography: 'Photography', videography: 'Videography', writing: 'Fashion Writing / Articles', music: 'Music', project: 'Personal Project / Portfolio' };
      var categoryLabel = CATEGORY_LABELS[row.category] || '';
      var mediaHtml = row.media_type === 'video'
        ? '<video src="' + url + '" controls muted style="width:120px;height:120px;object-fit:cover;background:#000;flex-shrink:0;"></video>'
        : row.media_type === 'audio'
        ? '<div style="width:120px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px;background:#141212;padding:12px 0;"><span style="color:#e2231a;font-size:28px;">♫</span><audio src="' + url + '" controls style="width:104px;"></audio></div>'
        : '<img src="' + url + '" />';
      var div = document.createElement('div');
      div.className = 'kf-row';
      div.innerHTML =
        mediaHtml +
        '<div class="kf-meta">' +
          '<div class="cap"></div>' +
          (categoryLabel ? '<span style="display:inline-block;border:1px solid #e2231a;color:#e2231a;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;margin-bottom:6px;">' + categoryLabel + '</span><br/>' : '') +
          'submitted ' + new Date(row.created_at).toLocaleString() + '<br/>' +
          'user: ' + row.user_id +
        '</div>' +
        '<div class="kf-form">' +
          '<div class="kf-label">Title</div>' +
          '<input type="text" class="f-title" placeholder="e.g. Street Style — SS27" value="' + (row.title ? row.title.replace(/"/g,'&quot;') : '') + '" />' +
          '<div class="kf-label">Description</div>' +
          '<textarea class="f-desc" placeholder="Short description for the store listing">' + (row.description || '') + '</textarea>' +
          '<div class="kf-label">Season / Collection Page</div>' +
          '<input type="text" class="f-season" placeholder="e.g. SS27, or Fall 2026" value="' + (row.season ? row.season.replace(/"/g,'&quot;') : '') + '" />' +
          '<div class="kf-label">Hashtags</div>' +
          '<input type="text" class="f-hashtags" placeholder="streetstyle, ss27, miami" value="' + (row.hashtags ? row.hashtags.replace(/"/g,'&quot;') : '') + '" />' +
          '<div class="kf-label">Social / Website Link</div>' +
          '<input type="text" class="f-social" placeholder="https://instagram.com/handle" value="' + (row.social_url ? row.social_url.replace(/"/g,'&quot;') : '') + '" />' +
          '<div class="kf-price-row">' +
            '<div style="flex:1;">' +
              '<div class="kf-label">Price (USD)</div>' +
              '<input type="number" class="f-price" min="0" step="0.01" placeholder="45.00" value="' + priceVal + '" />' +
            '</div>' +
            '<div style="flex:1;">' +
              '<div class="kf-label">City</div>' +
              '<select class="f-city">' + cityOptions + '</select>' +
            '</div>' +
          '</div>' +
          '<button class="kf-btn approve" data-id="' + row.id + '" data-path="' + row.file_path + '">Approve &amp; Publish</button>' +
          '<div class="kf-label" style="margin-top:10px;">Rejection Reason (optional, shown to contributor)</div>' +
          '<input type="text" class="f-reject-reason" placeholder="e.g. Blurry, watermark already visible in frame, wrong format" />' +
          '<button class="kf-btn reject" data-id="' + row.id + '">Reject</button>' +
          '<div class="kf-msg" data-msg-for="' + row.id + '"></div>' +
        '</div>';
      el.appendChild(div);
    });

    el.querySelectorAll('.approve').forEach(function(btn){
      btn.addEventListener('click', function(){ approveAndPublish(btn); });
    });
    el.querySelectorAll('.reject').forEach(function(btn){
      btn.addEventListener('click', function(){
        var reasonInput = btn.parentElement.querySelector('.f-reject-reason');
        var reason = reasonInput ? reasonInput.value.trim() : '';
        updateStatus(btn.dataset.id, 'rejected', reason);
      });
    });
  }

  async function approveAndPublish(btn){
    var row = btn.closest('.kf-row');
    var id = btn.dataset.id;
    var msgEl = row.querySelector('[data-msg-for="' + id + '"]');
    var title = row.querySelector('.f-title').value.trim();
    var description = row.querySelector('.f-desc').value.trim();
    var season = row.querySelector('.f-season').value.trim();
    var hashtags = row.querySelector('.f-hashtags').value.trim();
    var socialUrl = row.querySelector('.f-social').value.trim();
    var price = parseFloat(row.querySelector('.f-price').value);
    var city = row.querySelector('.f-city').value;

    if(!title || !season || !city || isNaN(price) || price < 0){
      msgEl.textContent = 'Fill in title, season, city, and a valid price first.';
      msgEl.className = 'kf-msg err';
      return;
    }

    btn.disabled = true;
    msgEl.textContent = 'Saving details…';
    msgEl.className = 'kf-msg';

    var priceCents = Math.round(price * 100);
    var update = await sb.from('photos').update({
      title: title, description: description, season: season,
      city: city, price_cents: priceCents, status: 'approved',
      hashtags: hashtags || null, social_url: socialUrl || null
    }).eq('id', id);

    if(update.error){
      btn.disabled = false;
      msgEl.textContent = update.error.message;
      msgEl.className = 'kf-msg err';
      return;
    }

    msgEl.textContent = 'Publishing to store…';
    try {
      var res = await fetch(PUBLISH_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ photo_id: id })
      });
      var data = await res.json();
      if(!res.ok){ throw new Error(data.error || 'Publish failed'); }
      msgEl.textContent = 'Published! ' + (data.url || '');
      msgEl.className = 'kf-msg ok';
      setTimeout(loadPending, 1200);
    } catch(err){
      btn.disabled = false;
      msgEl.textContent = 'Saved as approved, but store publish failed: ' + err.message;
      msgEl.className = 'kf-msg err';
    }
  }

  async function updateStatus(id, status, reason){
    var updatePayload = { status: status };
    if (status === 'rejected') updatePayload.rejection_reason = reason || null;
    await sb.from('photos').update(updatePayload).eq('id', id);
    loadPending();
  }

  sb.auth.getSession().then(function(res){
    var user = res.data.session && res.data.session.user;
    if(user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()){
      document.getElementById('kf-admin-login').style.display = 'none';
      document.getElementById('kf-admin-panel').style.display = 'block';
      loadPending();
    }
  });
})();
</script>
